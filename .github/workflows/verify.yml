name: Repository verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres-test:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: investigation
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: investigation_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U investigation -d investigation_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # The application URL is never used for fixtures; tests create random schemas in the test DB.
      DATABASE_URL: postgresql://investigation:ci_test_only@localhost:55433/investigation?schema=public
      TEST_DATABASE_URL: postgresql://investigation:ci_test_only@localhost:55433/investigation_test?schema=public
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run verify
